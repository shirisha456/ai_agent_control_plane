global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # The API also serves the DB-derived gauges (queue depth, worker counts,
  # expired-but-unreclaimed leases), refreshed on a timer so a scrape never
  # touches PostgreSQL.
  - job_name: acp-api
    static_configs:
      - targets: ["api:8000"]

  # Workers scale with `docker compose up --scale worker=5`, so their
  # addresses are not known in advance. Docker's embedded DNS returns one A
  # record per replica for the service name, which Prometheus follows -- so
  # scaling the fleet up or down needs no config change here.
  #
  # Each worker exports only its own counters; summing across instances is
  # Prometheus's job, not the fleet's.
  - job_name: acp-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

  - job_name: acp-reaper
    dns_sd_configs:
      - names: ["reaper"]
        type: A
        port: 9100
