services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acp
      POSTGRES_PASSWORD: acp
      POSTGRES_DB: acp
    ports: ["${ACP_PG_PORT:-5434}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp -d acp"]
      interval: 2s
      timeout: 3s
      retries: 20
    command:
      # The claim/complete cycle churns the same rows constantly, so `tasks`
      # produces dead tuples far faster than the stock autovacuum thresholds
      # expect. Left at defaults, the ready-queue index bloats and claim
      # latency degrades over a long benchmark run. See docs/ARCHITECTURE.md.
      - "postgres"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.02"
      - "-c"
      - "autovacuum_naptime=10s"
      - "-c"
      - "max_connections=200"

  migrate:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      ACP_DATABASE_URL: postgresql+psycopg://acp:acp@postgres:5432/acp
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      ACP_DATABASE_URL: postgresql+psycopg://acp:acp@postgres:5432/acp
    ports: ["${ACP_API_PORT:-8001}:8000"]
    command: ["uvicorn", "acp.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      ACP_DATABASE_URL: postgresql+psycopg://acp:acp@postgres:5432/acp
      ACP_METRICS_PORT: "9100"
      # What this machine offers, not what its adapters can execute. Empty by
      # default so every worker is a generalist; set per-deployment to carve
      # out specialists (e.g. ACP_WORKER_CAPABILITIES=gpu).
      ACP_WORKER_CAPABILITIES: "${ACP_WORKER_CAPABILITIES:-}"
    command: ["python", "-m", "acp.worker"]

  reaper:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      ACP_DATABASE_URL: postgresql+psycopg://acp:acp@postgres:5432/acp
      ACP_METRICS_PORT: "9100"
    command: ["python", "-m", "acp.reaper"]

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on: [api]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # 9090 is already taken on this machine by another project; override with
    # ACP_PROM_PORT if 9091 is busy too.
    ports: ["${ACP_PROM_PORT:-9091}:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: acp
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["${ACP_GRAFANA_PORT:-3002}:3000"]
